<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now | Cognifyz Technologies</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <nav>
        <h2>Cognifyz</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="details.html">Internship</a></li>
            <li><a href="success.html">Success</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="apply.html">Apply</a></li>
        </ul>
    </nav>

    <section class="section">
        <h1>Internship Application</h1>
        <p>Fill in your details and submit your application.</p>

        <div class="card" style="width:420px; margin:30px auto;">
            <form>
                <input type="text" placeholder="Full Name" required
                    style="width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
                <input type="email" placeholder="Email" required
                    style="width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
                <input type="tel" placeholder="Phone" required
                    style="width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
                <input type="text" placeholder="College" required
                    style="width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
                <textarea placeholder="Skills (HTML, CSS, JS, etc.)" rows="3"
                    style="width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #ccc;"></textarea>
                <input type="file" required style="width:100%; margin:10px 0;">
                <button type="submit" class="btn" style="width:100%;">Submit Application</button>
            </form>
        </div>
    </section>

    <footer>
        <p>Email: hr@cognifyztech.com</p>
        <p>Phone: +91 98765 43210</p>
        <p>© 2026 Cognifyz Technologies</p>
    </footer>

    <div class="bottom-nav">
        <button onclick="goBack()">⬅ Back</button>
    </div>

    <script>
        const pages = ["index.html", "about.html", "details.html", "success.html", "blog.html", "apply.html"];
        const currentPage = window.location.pathname.split("/").pop();
        const currentIndex = pages.indexOf(currentPage);

        document.getElementById("progressBar").style.width = ((currentIndex + 1) / pages.length) * 100 + "%";

        function goBack() {
            if (currentIndex > 0) window.location.href = pages[currentIndex - 1];
        }
    </script>

</body>

</html>
